<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <title>Nomes Salvos</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #ff8c42;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-orange-50">
    <div
      class="relative flex size-full min-h-screen flex-col bg-orange-50 justify-between group/design-root"
      style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'
    >
      <div class="flex flex-col">
        <header class="flex items-center p-4">
          <button
            class="text-gray-800 flex size-10 shrink-0 items-center justify-center rounded-full"
          >
            <span class="material-symbols-outlined"> arrow_back </span>
          </button>
          <h1
            class="text-gray-800 text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10"
          >
            Nomes Salvos
          </h1>
        </header>
        <div class="flex flex-col gap-4 p-4">
          <div class="flex items-center justify-between">
            <p class="text-gray-600 text-sm">Você salvou 0 nomes.</p>
            <button class="flex items-center gap-1.5 text-gray-800 text-sm font-medium">
              <span>Filtrar</span>
              <span class="material-symbols-outlined"> filter_list </span>
            </button>
          </div>
          <div class="flex flex-col gap-3">
            <!-- Nomes salvos serão renderizados aqui por JS -->
            <p class="text-gray-500 text-center">Nenhum nome salvo ainda.</p>
          </div>
        </div>
      </div>
      <footer
        class="sticky bottom-0 border-t border-orange-100 bg-orange-50/80 backdrop-blur-sm"
      >
        <nav class="flex items-center justify-around p-2">
          <a
            class="flex flex-col items-center justify-center gap-1 p-2 text-gray-500"
            href="index.html"
          >
            <span class="material-symbols-outlined"> auto_awesome </span>
            <p class="text-xs font-medium">Gerar</p>
          </a>
          <a
            class="flex flex-col items-center justify-center gap-1 rounded-full p-2 text-[var(--primary-color)]"
            href="salvos.html"
          >
            <span class="material-symbols-outlined"> bookmark </span>
            <p class="text-xs font-medium">Salvos</p>
          </a>
          <a
            class="flex flex-col items-center justify-center gap-1 p-2 text-gray-500"
            href="#"
          >
            <span class="material-symbols-outlined"> favorite_border </span>
            <p class="text-xs font-medium">Favoritos</p>
          </a>
        </nav>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
