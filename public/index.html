<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <title>Gerador de Nomes</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #ff6b6b;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-[#fff0f0]"
    style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'
  >
    <div
      class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden"
    >
      <div class="flex flex-col">
        <header class="flex items-center p-4">
          <button
            class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white shadow-sm"
          >
            <svg
              fill="currentColor"
              height="20px"
              viewBox="0 0 256 256"
              width="20px"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
              ></path>
            </svg>
          </button>
          <h1
            class="flex-1 text-center text-xl font-bold tracking-tight text-[#1a0f0f] pr-10"
          >
            Gerador de Nomes
          </h1>
        </header>
        <main class="flex-1 px-4 py-6">
          <div class="space-y-8">
            <div>
              <h2 class="text-base font-bold text-[#1a0f0f] mb-4">Gênero</h2>
              <div class="grid grid-cols-3 gap-3">
                <label
                  class="flex items-center justify-center rounded-xl border border-transparent bg-white p-4 text-sm font-medium text-[#4d4d4d] shadow-sm transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-50 has-[:checked]:text-[var(--primary-color)] has-[:checked]:font-bold cursor-pointer"
                >
                  <input checked="" class="sr-only" name="gender" type="radio" value="male" />
                  <span>Menino</span>
                </label>
                <label
                  class="flex items-center justify-center rounded-xl border border-transparent bg-white p-4 text-sm font-medium text-[#4d4d4d] shadow-sm transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-50 has-[:checked]:text-[var(--primary-color)] has-[:checked]:font-bold cursor-pointer"
                >
                  <input class="sr-only" name="gender" type="radio" value="female" />
                  <span>Menina</span>
                </label>
                <label
                  class="flex items-center justify-center rounded-xl border border-transparent bg-white p-4 text-sm font-medium text-[#4d4d4d] shadow-sm transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-50 has-[:checked]:text-[var(--primary-color)] has-[:checked]:font-bold cursor-pointer"
                >
                  <input class="sr-only" name="gender" type="radio" value="both" />
                  <span>Ambos</span>
                </label>
              </div>
            </div>
            <div>
              <h2 class="text-base font-bold text-[#1a0f0f] mb-4">Origem</h2>
              <div class="relative">
                <select
                  id="origin-select"
                  class="w-full appearance-none rounded-xl border-0 bg-white px-4 py-4 text-base font-medium text-[#1a0f0f] shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]"
                >
                  <option value="">Selecione a origem</option>
                  <!-- Opções preenchidas por JS -->
                </select>
                <div
                  class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500"
                >
                  <svg
                    fill="none"
                    height="20"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    width="20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M19 9l-7 7-7-7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
            <div>
              <h2 class="text-base font-bold text-[#1a0f0f] mb-4">
                Popularidade
              </h2>
              <div class="relative">
                <select
                  id="popularity-select"
                  class="w-full appearance-none rounded-xl border-0 bg-white px-4 py-4 text-base font-medium text-[#1a0f0f] shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]"
                >
                  <option value="">Selecione a popularidade</option>
                  <!-- Opções preenchidas por JS -->
                </select>
                <div
                  class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500"
                >
                  <svg
                    fill="none"
                    height="20"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    width="20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M19 9l-7 7-7-7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>
          <div class="mt-12">
            <button
              id="generate-btn"
              class="flex w-full cursor-pointer items-center justify-center rounded-full bg-[var(--primary-color)] h-14 px-5 text-base font-bold text-white shadow-lg shadow-red-500/40"
            >
              <span class="truncate">Gerar Nomes</span>
            </button>
          </div>
        </main>
      </div>
      <footer class="sticky bottom-0">
        <div
          class="flex border-t border-[#ffe0e0] bg-white/80 px-4 pb-4 pt-3 backdrop-blur-lg"
        >
          <a
            class="flex flex-1 flex-col items-center justify-center gap-1 text-[var(--primary-color)]"
            href="index.html"
          >
            <div
              class="flex h-8 w-12 items-center justify-center rounded-full bg-red-100"
              data-icon="MagicWand"
            >
              <svg
                fill="currentColor"
                height="22px"
                viewBox="0 0 256 256"
                width="22px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M248,152a8,8,0,0,1-8,8H224v16a8,8,0,0,1-16,0V160H192a8,8,0,0,1,0-16h16V128a8,8,0,0,1,16,0v16h16A8,8,0,0,1,248,152ZM56,72H72V88a8,8,0,0,0,16,0V72h16a8,8,0,0,0,0-16H88V40a8,8,0,0,0-16,0V56H56a8,8,0,0,0,0,16ZM184,192h-8v-8a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0v-8h8a8,8,0,0,0,0-16ZM219.31,80,80,219.31a16,16,0,0,1-22.62,0L36.68,198.63a16,16,0,0,1,0-22.63L176,36.69a16,16,0,0,1,22.63,0l20.68,20.68A16,16,0,0,1,219.31,80ZM208,68.69,187.31,48l-32,32L176,100.69Z"
                ></path>
              </svg>
            </div>
            <p class="text-xs font-bold">Gerar</p>
          </a>
          <a
            class="flex flex-1 flex-col items-center justify-center gap-1 text-[#4d4d4d]"
            href="salvos.html"
          >
            <div
              class="flex h-8 items-center justify-center"
              data-icon="BookmarkSimple"
            >
              <svg
                fill="currentColor"
                height="24px"
                viewBox="0 0 256 256"
                width="24px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,177.57-51.77-32.35a8,8,0,0,0-8.48,0L72,209.57V48H184Z"
                ></path>
              </svg>
            </div>
            <p class="text-xs font-medium">Salvos</p>
          </a>
          <a
            class="flex flex-1 flex-col items-center justify-center gap-1 text-[#4d4d4d]"
            href="#"
          >
            <div
              class="flex h-8 items-center justify-center"
              data-icon="Heart"
            >
              <svg
                fill="currentColor"
                height="24px"
                viewBox="0 0 256 256"
                width="24px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32ZM128,206.8C109.74,196.16,32,147.69,32,94A46.06,46.06,0,0,1,78,48c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,147.61,146.24,196.15,128,206.8Z"
                ></path>
              </svg>
            </div>
            <p class="text-xs font-medium">Favoritos</p>
          </a>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
